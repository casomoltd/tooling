# Near-identical to the other @casomoltd package repos' publish.yml
# (OIDC trusted publish to npm). Kept per-repo on purpose: npm trusted
# publishing matches a specific repo + workflow file, so a per-repo file
# is the simplest reliable setup. Unlike the product libs, tooling has no
# git dependencies, so npm@latest (>=12, which disables git-protocol deps)
# publishes it fine with no version pin.
name: Publish to npm

on:
  # Release = a version tag pushed from a maintainer's machine
  # (npm version minor -> git push --follow-tags). PR merges to
  # main do NOT publish — only the tag push does.
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — trusted publishing, no stored token

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # No npm pin needed: Node 24 bundles npm 11.x, which is exactly the
      # range we want — >= 11.5.1 for trusted publishing, and short of
      # npm 12. The 12.0.0 `npm ci` strictness this pin was raised against
      # is fixed (12.0.2 installs our Linux-generated locks cleanly), but
      # npm 12 still blocks non-registry fetches by default
      # (EALLOWREMOTE), which breaks a from-scratch lockfile regen.
      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish
